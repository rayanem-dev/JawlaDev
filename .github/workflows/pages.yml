name: Deploy portal
on:
  push:
    branches: [main, claude/portail-apps-releases-4yiztm]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    # Pages n'accepte que la branche par défaut : les autres branches sont ignorées sans erreur
    if: github.ref_name == github.event.repository.default_branch
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
